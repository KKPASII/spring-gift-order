<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 추가</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');
    :root {
      --bg-color: #f4f7fa; --card-bg-color: #ffffff; --primary-color: #6a82fb; --primary-hover-color: #5468d4;
      --secondary-color: #43d9a0; --secondary-hover-color: #35ad80; --delete-color: #ff7b7b; --delete-hover-color: #e66a6a;
      --text-color: #333; --text-light-color: #777; --border-color: #e9ecef; --shadow-color: rgba(106, 130, 251, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .header h1 { font-size: 2rem; font-weight: 700; color: var(--text-color); }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.8rem 1.5rem; border-radius: 50px; border: none; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease, transform 0.2s ease; text-decoration: none; }
    .form-card { background-color: var(--card-bg-color); border-radius: 16px; box-shadow: 0 8px 25px var(--shadow-color); padding: 2.5rem; margin-top: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-light-color); }
    .form-group input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; font-family: 'Nunito', sans-serif; }
    .form-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.5rem; }
    .btn-primary { background-color: var(--primary-color); }
    .btn-secondary { background-color: var(--secondary-color); }
    .btn-cancel { background-color: #f0f2f5; color: var(--text-light-color); }
    .options-section { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); }
    .options-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .options-header h3 { font-size: 1.2rem; color: var(--text-color); }
    .option-item { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; }
    .option-item .form-group { flex-grow: 1; margin-bottom: 0; }
    .btn-delete-option { background-color: var(--delete-color); padding: 0.5rem; min-width: 40px; height: 40px; border-radius: 50%; border: none; color: white; cursor: pointer;}
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>상품 추가</h1>
  </div>

  <div class="form-card">
    <form id="add-product-form">
      <div class="form-group">
        <label for="productName">상품명</label>
        <input type="text" id="productName" name="name" required placeholder="예: 프리미엄 키보드">
      </div>
      <div class="form-group">
        <label for="productPrice">가격</label>
        <input type="number" id="productPrice" name="price" required placeholder="숫자만 입력하세요">
      </div>
      <div class="form-group">
        <label for="productImageUrl">이미지 URL</label>
        <input type="url" id="productImageUrl" name="imageUrl" required placeholder="예: https://example.com/image.jpg">
      </div>

      <div class="options-section">
        <div class="options-header">
          <h3>상품 옵션 (최소 1개 이상)</h3>
          <button type="button" id="add-option-btn" class="btn btn-secondary">옵션 추가</button>
        </div>
        <div id="options-container">
        </div>
      </div>

      <div class="form-actions">
        <a href="/management/products" class="btn btn-cancel">취소</a>
        <button type="submit" class="btn btn-primary">상품 추가하기</button>
      </div>
    </form>
  </div>
</div>

<script>
  // HTML 요소 가져오기
  const addForm = document.getElementById('add-product-form');
  const optionsContainer = document.getElementById('options-container');
  const addOptionBtn = document.getElementById('add-option-btn');

  //옵션 행 추가/삭제
  addOptionBtn.addEventListener('click', () => addOptionRow());

  function addOptionRow() {
    const optionDiv = document.createElement('div');
    optionDiv.classList.add('option-item');
    optionDiv.innerHTML = `
      <div class="form-group">
        <label>옵션명</label>
        <input type="text" class="option-name" required placeholder="예: S사이즈, 흰색">
      </div>
      <div class="form-group">
        <label>수량</label>
        <input type="number" class="option-quantity" required placeholder="예: 100">
      </div>
      <button type="button" class="btn btn-delete-option" title="이 옵션 삭제">X</button>
    `;
    optionsContainer.appendChild(optionDiv);
    optionDiv.querySelector('.btn-delete-option').addEventListener('click', () => optionDiv.remove());
  }

  document.addEventListener('DOMContentLoaded', () => addOptionRow());

  // 폼 제출
  addForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    // 가격 10진수로 변환
    const priceValue = parseInt(document.getElementById('productPrice').value, 10);
    if (isNaN(priceValue)) {
      alert('유효한 가격을 입력해주세요.');
      return;
    }
    // ProductRequestDto 형식에 맞추기
    const productData = {
      name: document.getElementById('productName').value,
      price: priceValue,
      imageUrl: document.getElementById('productImageUrl').value,
      options: []
    };

    const optionItems = optionsContainer.querySelectorAll('.option-item');
    optionItems.forEach(item => {
      const nameInput = item.querySelector('.option-name');
      const quantityInput = item.querySelector('.option-quantity');
      if (nameInput.value && quantityInput.value) {
        productData.options.push({
          name: nameInput.value,
          quantity: parseInt(quantityInput.value, 10),
        });
      }
    });

    if (productData.options.length === 0) {
      alert('최소 하나 이상의 유효한 옵션을 추가해야 합니다.');
      return;
    }

    try {
      const response = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(productData),
      });

      if (response.ok) {
        alert('상품이 성공적으로 추가되었습니다.');
        window.location.href = '/management/products';
      } else {
        const errorData = await response.json();
        const statusCode = response.status;

        let errorMessages = `(상태 코드: ${statusCode})\n`;

        if (errorData.errors && Array.isArray(errorData.errors)) {
          // 400 에러 - 유효성 검사(@Valid) 실패
          errorMessages += errorData.errors.map(e => e.defaultMessage).join('\n');
        } else if (errorData.message) {
          errorMessages += errorData.message;
        } else {
          // 500 에러
          errorMessages += '알 수 없는 오류가 발생했습니다. 서버 로그를 확인해주세요.';
        }

        alert('상품 추가 실패:\n' + errorMessages);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('상품 추가: 서버와 통신 중 오류가 발생했습니다.');
    }
  });
</script>

</body>
</html>
