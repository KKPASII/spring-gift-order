<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 수정</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');
    :root {
      --bg-color: #f4f7fa; --card-bg-color: #ffffff; --primary-color: #6a82fb; --primary-hover-color: #5468d4;
      --secondary-color: #43d9a0; --secondary-hover-color: #35ad80; --text-color: #333; --text-light-color: #777;
      --border-color: #e9ecef; --shadow-color: rgba(106, 130, 251, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    .header h1 { font-size: 2rem; font-weight: 700; color: var(--text-color); margin-bottom: 1rem;}
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.8rem 1.5rem; border-radius: 50px; border: none; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; }
    .form-card { background-color: var(--card-bg-color); border-radius: 16px; box-shadow: 0 8px 25px var(--shadow-color); padding: 2.5rem; margin-top: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-light-color); }
    .form-group input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
    .form-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.5rem; }
    .btn-primary { background-color: var(--primary-color); }
    .btn-secondary { background-color: var(--secondary-color); }
    .btn-cancel { background-color: #f0f2f5; color: var(--text-light-color); }
    .options-section { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); }
    .options-section h3 { font-size: 1.2rem; color: var(--text-color); margin-bottom: 1rem; }
    #existing-options-list { list-style: none; margin-bottom: 2rem; }
    .existing-option-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-radius: 8px; background-color: #f9f9f9; margin-bottom: 0.5rem; }
    .existing-option-item span { font-weight: 600; }
    #add-new-option-form { display: flex; gap: 1rem; align-items: flex-end; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>상품 수정</h1>
  </div>

  <div class="form-card">
    <form id="edit-product-form" th:object="${product}">
      <input type="hidden" id="productId" th:value="*{id}">
      <div class="form-group">
        <label for="productName">상품명</label>
        <input type="text" id="productName" name="name" required th:value="*{name}">
      </div>
      <div class="form-group">
        <label for="productPrice">가격</label>
        <input type="number" id="productPrice" name="price" required th:value="*{price}">
      </div>
      <div class="form-group">
        <label for="productImageUrl">이미지 URL</label>
        <input type="url" id="productImageUrl" name="imageUrl" required th:value="*{imageUrl}">
      </div>
      <div class="form-actions">
        <a th:href="@{/management/products}" class="btn btn-cancel">취소</a>
        <button type="submit" class="btn btn-primary">상품 정보 저장</button>
      </div>
    </form>

    <div class="options-section">
      <h3>옵션 관리</h3>
      <ul id="existing-options-list">
      </ul>
      <form id="add-new-option-form">
        <div class="form-group" style="flex-grow: 1;">
          <label for="newOptionName">새 옵션명</label>
          <input type="text" id="newOptionName" required>
        </div>
        <div class="form-group" style="width: 120px;">
          <label for="newOptionQuantity">수량</label>
          <input type="number" id="newOptionQuantity" required>
        </div>
        <button type="submit" class="btn btn-secondary" style="height: 45px;">옵션 추가</button>
      </form>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const productId = /*[[${product.id}]]*/ 0;
  const existingOptionsList = document.getElementById('existing-options-list');
  const addNewOptionForm = document.getElementById('add-new-option-form');

  function displayOption(option) {
    const li = document.createElement('li');
    li.classList.add('existing-option-item');
    li.innerHTML = `
      <span>${option.name}</span>
      <span>수량: ${option.quantity}개</span>
    `;
    existingOptionsList.appendChild(li);
  }

  async function fetchAndDisplayOptions() {
    existingOptionsList.innerHTML = '';
    try {
      const response = await fetch(`/api/products/${productId}/options`);
      if (response.ok) {
        const options = await response.json();
        options.forEach(displayOption);
      }
    } catch (error) {
      console.error('옵션 로딩 중 오류:', error);
    }
  }

  document.addEventListener('DOMContentLoaded', fetchAndDisplayOptions);

  // 새 옵션 추가
  addNewOptionForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const name = document.getElementById('newOptionName').value;
    const quantity = parseInt(document.getElementById('newOptionQuantity').value, 10);
    const newOptionData = { name, quantity };

    try {
      const response = await fetch(`/api/products/${productId}/options`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newOptionData),
      });

      if (response.ok) {
        const createdOption = await response.json();
        displayOption(createdOption); // 화면에 즉시 추가
        addNewOptionForm.reset();
      } else {
        const errorData = await response.json();
        alert('옵션 추가 실패:\n' + (errorData.message || '알 수 없는 오류'));
      }
    } catch (error) {
      console.error('옵션 추가 중 오류:', error);
    }
  });

  // 상품 정보 수정
  const editProductForm = document.getElementById('edit-product-form');
  editProductForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const productData = {
      name: document.getElementById('productName').value,
      price: parseInt(document.getElementById('productPrice').value, 10),
      imageUrl: document.getElementById('productImageUrl').value
    };

    try {
      const response = await fetch(`/api/products/${productId}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(productData),
      });
      if (response.ok) {
        alert('상품 정보가 성공적으로 수정되었습니다.');
        window.location.href = '/management/products';
      } else {
        const errorData = await response.json();
        alert('상품 정보 수정 실패:\n' + (errorData.message || '알 수 없는 오류'));
      }
    } catch(error) {
      console.error('상품 정보 수정 중 오류:', error);
    }
  });
</script>

</body>
</html>
