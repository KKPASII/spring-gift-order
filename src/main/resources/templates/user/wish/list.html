<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 위시리스트</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');
        :root {
            --bg-color: #f4f7fa; --card-bg-color: #ffffff; --primary-color: #6a82fb;
            --primary-hover-color: #5468d4; --secondary-color: #43d9a0; --secondary-hover-color: #35ad80;
            --delete-color: #ff7b7b; --delete-hover-color: #e66a6a; --text-color: #333;
            --text-light-color: #777; --border-color: #e9ecef; --shadow-color: rgba(106, 130, 251, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .header h1 { font-size: 2rem; font-weight: 700; color: var(--primary-color); }
        .controls-wrapper { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1.5rem; }
        .control-group { display: flex; align-items: center; gap: 0.5rem; }
        .control-group label { font-weight: 600; color: var(--text-light-color); }
        .control-group select {
            padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border-color);
            font-family: 'Nunito', sans-serif; font-weight: 600; cursor: pointer;
            background-color: white; appearance: none; padding-right: 2rem;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%2C%22height%22%3A%22292.4%22%3E%3Cpath%20fill%3D%22%236a82fb%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.4-5.4-13z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; background-position: right .7em top 50%; background-size: .65em auto;
        }
        .wish-list { display: flex; flex-direction: column; gap: 1rem; }
        .wish-card { background-color: var(--card-bg-color); border-radius: 12px; box-shadow: 0 4px 15px var(--shadow-color); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; align-items: center; padding: 1rem; gap: 1.5rem; }
        .wish-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px var(--shadow-color); }
        .product-image { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .wish-info { flex-grow: 1; }
        .product-name { font-size: 1.1rem; font-weight: 700; }
        .product-price { font-size: 1rem; font-weight: 600; color: var(--primary-color); margin: 0.25rem 0; }
        .wish-quantity { font-size: 0.9rem; color: var(--text-light-color); }
        .wish-actions { margin-left: auto; }
        .action-btn { background: var(--delete-color); border: none; cursor: pointer; padding: 0.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease; }
        .action-btn:hover { background-color: var(--delete-hover-color); }
        .action-btn svg { width: 20px; height: 20px; color: white; }
        .pagination { display: flex; justify-content: center; align-items: center; margin-top: 2rem; gap: 0.5rem; }
        .pagination a, .pagination span { display: inline-block; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; color: var(--text-color); background-color: var(--card-bg-color); border: 1px solid var(--border-color); transition: background-color 0.2s, color 0.2s; }
        .pagination a:hover { background-color: var(--primary-hover-color); color: white; }
        .pagination .active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .pagination .disabled { color: #ccc; background-color: #f8f8f8; cursor: not-allowed; }
        .empty-wishlist { text-align: center; padding: 3rem; background-color: var(--card-bg-color); border-radius: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1>내 위시리스트</h1>
    </header>

    <div class="controls-wrapper">
        <div class="control-group">
            <label for="sort-selector">정렬:</label>
            <select id="sort-selector">
                <option value="id,desc" th:selected="${#strings.equals(currentSort, 'id,desc')}">최근에 담은 순</option>
                <option value="id,asc" th:selected="${#strings.equals(currentSort, 'id,asc')}">오래전에 담은 순</option>
            </select>
        </div>
        <div class="control-group">
            <label for="size-selector">개수:</label>
            <select id="size-selector">
                <option value="10" th:selected="${currentSize == 10}">10개씩</option>
                <option value="20" th:selected="${currentSize == 20}">20개씩</option>
                <option value="30" th:selected="${currentSize == 30}">30개씩</option>
            </select>
        </div>
    </div>

    <main class="wish-list">
        <th:block th:if="${wishes.hasContent()}">
            <div class="wish-card" th:id="|wish-card-${wish.id}|" th:each="wish : ${wishes.content}">
                <img th:src="${wish.product.imageUrl}" alt="Product Image" class="product-image">
                <div class="wish-info">
                    <h2 class="product-name" th:text="${wish.product.name}"></h2>
                    <p class="product-price" th:text="|${#numbers.formatInteger(wish.product.price, 3, 'COMMA')}원|"></p>
                    <p class="wish-quantity" th:text="|수량: ${wish.quantity}개|"></p>
                </div>
                <div class="wish-actions">
                    <button type="button" class="action-btn delete-btn" th:data-wish-id="${wish.id}" title="삭제하기">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16"><path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5zM4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06zm3.5.013l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06zm3.5-.014l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06z"/></svg>
                    </button>
                </div>
            </div>
        </th:block>
        <div th:if="${!wishes.hasContent()}" class="empty-wishlist">
            <h2>위시리스트가 비어있습니다.</h2>
        </div>
    </main>

    <nav class="pagination" th:if="${wishes.totalPages > 1}">
        <a th:href="${wishes.first} ? '#' : @{/wishes(page=${wishes.number - 1}, size=${wishes.size}, sort=${param.sort})}"
           th:classappend="${wishes.first} ? 'disabled' : ''">
            &laquo;
        </a>
        <th:block th:each="pageNumber : ${#numbers.sequence(0, wishes.totalPages - 1)}">
            <a th:href="@{/wishes(page=${pageNumber}, size=${wishes.size}, sort=${param.sort})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == wishes.number} ? 'active' : ''"></a>
        </th:block>
        <a th:href="${wishes.last} ? '#' : @{/wishes(page=${wishes.number + 1}, size=${wishes.size}, sort=${param.sort})}"
           th:classappend="${wishes.last} ? 'disabled' : ''">
            &raquo;
        </a>
    </nav>
</div>

<script th:inline="javascript">
    const currentPage = /*[[${wishes.number}]]*/ 0;
    const currentSize = /*[[${wishes.size}]]*/ 10;

    document.addEventListener('DOMContentLoaded', () => {
        // --- 위시리스트 삭제 스크립트 ---
        const wishList = document.querySelector('.wish-list');
        wishList.addEventListener('click', (event) => {
            const deleteButton = event.target.closest('.delete-btn');
            if (!deleteButton) return;

            const wishId = deleteButton.dataset.wishId;
            if (!wishId) {
                console.error('Wish ID is undefined. Check th:data-wish-id attribute.');
                return;
            }

            if (confirm('해당 상품을 위시리스트에서 삭제하시겠습니까?')) {
                fetch(`/api/wishes/${wishId}`, { method: 'DELETE' })
                    .then(response => {
                        if (response.ok) {
                            const cardToRemove = document.getElementById(`wish-card-${wishId}`);
                            if (cardToRemove) {
                                cardToRemove.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                                cardToRemove.style.opacity = '0';
                                cardToRemove.style.transform = 'scale(0.95)';
                                setTimeout(() => cardToRemove.remove(), 400);
                            }
                        } else {
                            alert('삭제에 실패했습니다.');
                        }
                    }).catch(error => console.error('Error:', error));
            }
        });

        const sortSelector = document.getElementById('sort-selector');
        const sizeSelector = document.getElementById('size-selector');

        if (sortSelector) {
            sortSelector.addEventListener('change', () => {
                const currentUrl = new URL(window.location.href);
                currentUrl.searchParams.set('sort', sortSelector.value);
                currentUrl.searchParams.set('page', '0');
                window.location.href = currentUrl.href;
            });
        }

        if (sizeSelector) {
            sizeSelector.addEventListener('change', () => {
                const currentUrl = new URL(window.location.href);
                const newSize = sizeSelector.value;

                const currentOffset = currentPage * currentSize;
                const newPage = Math.floor(currentOffset / newSize);

                currentUrl.searchParams.set('size', newSize);
                currentUrl.searchParams.set('page', newPage.toString());
                window.location.href = currentUrl.href;
            });
        }
    });
</script>

</body>
</html>
